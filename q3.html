    <!-- Practical 3 Content -->
    <h2 align="center">Practical 3: Student Marksheet</h2>

    <table border="1" cellpadding="10" cellspacing="0" width="70%" align="center">
        <!-- Table Heading using colspan -->
        <tr>
            <th colspan="6" bgcolor="#e0e0e0">Student Marksheet</th>
        </tr>
        
        <!-- Headers with rowspan and colspan -->
        <tr bgcolor="#f0f0f0">
            <th rowspan="2">Roll No.</th>
            <th rowspan="2">Name</th>
            <th colspan="3">Subjects</th>
            <th rowspan="2">Total</th>
        </tr>
        <tr bgcolor="#f0f0f0">
            <th>Java</th>
            <th>Python</th>
            <th>DBMS</th>
        </tr>
        
        <!-- Data Rows -->
        <tr align="center">
            <td>101</td>
            <td>Rahul</td>
            <td>85</td>
            <td>78</td>
            <td>82</td>
            <td>245</td>
        </tr>
        <tr align="center">
            <td>102</td>
            <td>Aman</td>
            <td>75</td>
            <td>88</td>

            <td>242</td>
